services:
  postgres:
    image: postgres:16-alpine
    container_name: totem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: totem_municipal
      POSTGRES_USER: totem_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totem_app -d totem_municipal"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
